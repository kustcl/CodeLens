name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node --test tests/test_graph.mjs
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --prefix codelens/scripts
      - run: python -B -m unittest discover -s tests -p test_typescript.py -v
